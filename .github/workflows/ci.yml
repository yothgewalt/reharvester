name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Scoped to the packages we own: a bare ./... also compiles
      # web/node_modules/flatted, a Go file that ships inside an npm
      # dependency and could break this build on a `bun install`.
      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./cmd/... ./internal/...

      # The check that was missing. Building natively only ever proved the host
      # platform, so a POSIX-only syscall reached a Windows user's editor
      # before any gate saw it. Compile-only: go test cannot run a foreign
      # binary, and compiling is where this class of error surfaces.
      - name: Cross-compile every release target
        run: |
          failed=0
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            if ! GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
                 go build ./cmd/... ./internal/...; then
              failed=1
            fi
          done
          exit $failed

      - name: Test with the race detector
        run: go test -race ./internal/httpapi/... ./internal/rag/... ./cmd/reharvester/...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build the static export
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
        run: bun run build

      - name: Confirm the export produced a site
        run: test -f dist/index.html
